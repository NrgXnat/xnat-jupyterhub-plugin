/*
 * xnat-jupyterhub-plugin: build.gradle
 */
buildscript {
    ext {
        vXnat = "1.11.0-SNAPSHOT"   // jakarta / Tomcat 10 line
    }
}

plugins {
    id "java"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "jacoco"
    id "io.spring.dependency-management" version "1.1.7"
}

group "org.nrg.xnatx.plugins"
version "1.3.5-SNAPSHOT"
description "JupyterHub Plugin for XNAT"

java {
    // Pin the toolchain to 21: the Gradle daemon may run a newer JDK that Lombok can't process, and old
    // jars can trip JDK 22+'s strict zip64 CEN validation. Match core.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

compileJava {
    options.fork = true   // a cross-JDK toolchain must fork
}

// Spring 6 (Spring MVC) no longer discovers method parameter names from bytecode; the xapi
// @RestController handlers here (@RequestParam/@PathVariable without explicit names) resolve only when
// compiled with -parameters. Core sets this in its buildSrc convention; this standalone build must too.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

repositories {
    // Scope mavenLocal to org.nrg.* so a locally-published SNAPSHOT of core is consumed without shadowing
    // partial third-party artifacts (e.g. ehcache-*-jakarta classifiers). See migration guide.
    mavenLocal { content { includeGroupByRegex 'org\\.nrg.*' } }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
    maven { url "https://www.dcm4che.org/maven2" }
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:parent:${vXnat}"
    }
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

configurations {
    implementAndInclude
    implementation.extendsFrom(xnatProvided)
    implementation.extendsFrom(implementAndInclude)
    testImplementation.exclude group: 'org.slf4j', module: 'log4j-over-slf4j'
}

dependencies {
    xnatProvided platform("org.nrg:parent:${vXnat}")
    xnatProvided "org.nrg:framework"
    xnatProvided "org.nrg.xnat:web"
    xnatProvided "org.nrg.xdat:core"
    // springfox is dead on Spring 6. The source only uses io.swagger.annotations.* (@Api/@ApiModel/
    // @ApiOperation/@ApiResponse(s) etc.); provide those directly. Runtime OpenAPI/UI is served by core's
    // springdoc, so springfox-swagger-ui is dropped. See migration guide.
    xnatProvided "io.swagger:swagger-annotations:1.5.20"
    // Provided by the XNAT webapp at runtime; xnat-web no longer exposes these on the compile classpath
    xnatProvided "jakarta.servlet:jakarta.servlet-api"
    xnatProvided "org.aspectj:aspectjweaver"
    xnatProvided "commons-lang:commons-lang"
}

dependencies {
    implementAndInclude('io.projectreactor:reactor-core') {
        version {
            strictly "2.0.8.RELEASE"
        }
    }
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-guava"
    testImplementation "junit:junit"
    testImplementation "com.h2database:h2"
    testImplementation "org.hamcrest:hamcrest-library"
    testImplementation 'org.mockito:mockito-core:4.8.0'
    testImplementation "org.springframework:spring-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework.security:spring-security-config"
    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework:spring-orm"
    testImplementation "org.apache.commons:commons-dbcp2"
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    // xdat static initializers still reference log4j 1.x, which the XNAT
    // webapp provides at runtime but the 1.10.x BOM no longer brings in
    testRuntimeOnly 'log4j:log4j:1.2.17'
}

test {
    useJUnit()
}

def buildDate = new Date()

// Pulls in GitHub Actions environment variables if available.
def github_actor = System.getenv().GITHUB_ACTOR ?: "Unknown"
def github_repo = System.getenv().GITHUB_REPOSITORY ?: "Unknown"
def github_sha = System.getenv().GITHUB_SHA ?: "Unknown"
def github_ref = System.getenv().GITHUB_REF ?: "Unknown"

ext.gitManifest = ["Application-Name": "PIXI-PLUGIN",
                   "Build-Date"      : buildDate,
                   "GITHUB-ACTOR"    : github_actor,
                   "GITHUB-REPO"     : github_repo,
                   "GITHUB-SHA"      : github_sha,
                   "GITHUB-REF"      : github_ref]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

// Configure the compileJava task to call the xnatDataBuilder task before trying to compile any
// Java code in the plugin. This is required for custom data types
compileJava.dependsOn project.tasks["xnatDataBuilder"]

// Not required in a standard build, but the XNAT data builder generates code from XNAT data-type
// schemas that the compiler needs to know about.
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir 'src/main/resources'
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

jar {
    manifest {
        attributes(gitManifest)
    }
    from {
        (configurations.implementAndInclude - configurations.xnatProvided).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

tasks.register('deploy-jar', Copy) {
    description = "Copies the JAR file to a specified location. Requires the 'filePath' property to be set. Example: ./gradlew clean jar deploy-jar -PfilePath=/path/to/destination"
    from jar
    into project.findProperty('filePath')
}
