name: Main

on:
  push:
    branches:
        - main

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Plugin JAR
        uses: ./.github/actions/build-plugin-jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ env.jar-path }}
          retention-days: 90
